<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistente Pessoal — entrando…</title>
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#0f1115;color:#eee;text-align:center;}
  p{opacity:.7;font-size:14px;padding:0 24px;}
</style>
</head>
<body>
<div>
  <p>Entrando no Assistente Pessoal…</p>
  <div id="fallback" style="display:none;margin-top:18px;">
    <a id="openBtn" href="#" style="display:inline-block;background:#d4a84a;color:#0f1115;font-weight:600;text-decoration:none;padding:12px 22px;border-radius:12px;font-size:15px;">Abrir o Assistente Pessoal</a>
    <p style="font-size:12px;margin-top:14px;">Se não abrir, <a id="altLink" href="#" style="color:#d4a84a;">tenta por aqui</a> ou volta à app e toca de novo em “Entrar com Google”.</p>
  </div>
</div>
<script>
  // Esta página só existe para devolver o token do Google à app nativa.
  // startGoogleAuth() (index.html) abre accounts.google.com num separador do
  // sistema com esta página como redirect_uri; o Google acrescenta o token no
  // fragmento (#access_token=…). Aqui reencaminhamos esse fragmento para a app
  // pelo esquema "assistentepessoal://" (Android intent-filter / iOS
  // CFBundleURLTypes); o listener 'appUrlOpen' em index.html termina o login.
  //
  // Android: o Chrome bloqueia saltos automáticos para esquemas personalizados
  // sem um toque do utilizador (visto no Xiaomi da Lu, 22/09) — por isso usa-se
  // o formato intent:// (aponta diretamente ao pacote) e, se em 1,2 s a app não
  // abrir, aparece um botão para o utilizador tocar.
  // Só os parâmetros esperados seguem para a app, cada um codificado; o
  // fragmento original é apagado do histórico deste separador.
  var src = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
  var out = new URLSearchParams();
  ['access_token', 'expires_in', 'token_type', 'state', 'error'].forEach(function (k) {
    var v = src.get(k); if (v) out.set(k, v);
  });
  try { history.replaceState(null, '', window.location.pathname); } catch (e) {}
  var q = out.toString();
  var hash = q ? '#' + q : '';
  var isAndroid = /Android/i.test(navigator.userAgent);
  var appUrl = 'assistentepessoal://oauthcallback' + hash;
  var intentUrl = 'intent://oauthcallback?' + q + '#Intent;scheme=assistentepessoal;package=com.tocsmartgroup.assistente;end';
  var primary = isAndroid ? intentUrl : appUrl;
  try { window.location.replace(primary); } catch (e) {}
  setTimeout(function () {
    var box = document.getElementById('fallback');
    if (!box) return;
    document.getElementById('openBtn').setAttribute('href', primary);
    document.getElementById('altLink').setAttribute('href', appUrl);
    box.style.display = 'block';
  }, 1200);
</script>
</body>
</html>
