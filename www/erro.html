<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistente Pessoal</title>
<style>
:root{--bg:#f4f5f8;--tx:#141a2e;--dim:#5b6480;--ac:#2f6df0}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--tx:#eef1fa;--dim:#9aa4c2;--ac:#4f8dfb}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center}
.b{max-width:340px}
.l{width:72px;height:72px;border-radius:18px;background:var(--ac);margin:0 auto 22px;display:flex;align-items:center;justify-content:center}
.l svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
h1{font-size:22px;margin:0 0 8px}
p{font-size:15px;line-height:1.5;color:var(--dim);margin:0 0 24px}
button{font:inherit;font-weight:600;font-size:16px;color:#fff;background:var(--ac);border:0;border-radius:14px;padding:14px 28px;min-height:48px;cursor:pointer}
</style></head><body>
<div class="b">
<div class="l"><svg viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r=".6"/></svg></div>
<h1>Sem ligação</h1>
<p>Não foi possível carregar o Assistente Pessoal. Verifique a ligação à internet e tente novamente.</p>
<button id="r" type="button">Tentar novamente</button>
</div>
<script>
document.getElementById('r').addEventListener('click',function(){location.href='https://tiagocamargos1.github.io/Assistente/';});
window.addEventListener('online',function(){location.href='https://tiagocamargos1.github.io/Assistente/';});
</script>
</body></html>
